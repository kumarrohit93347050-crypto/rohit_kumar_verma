<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>3D Highway Car Racing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">

    <header>
        <h1>🏎️ HIGHWAY RACER</h1>
        <p>Ultimate 3D Racing Challenge</p>
    </header>

    <div class="score-board">
        <div>
            <span>SCORE</span>
            <h2 id="score">0</h2>
        </div>

        <div>
            <span>BEST</span>
            <h2 id="best">0</h2>
        </div>

        <div>
            <span>SPEED</span>
            <h2 id="speed">0</h2>
        </div>
    </div>

    <div class="canvas-wrapper">

        <canvas id="gameCanvas"
                width="450"
                height="700">
        </canvas>

        <div id="startScreen" class="overlay">
            <h2>🏁 HIGHWAY RACER</h2>
            <p>Avoid traffic and make your high score!</p>
            <button id="startBtn">START GAME</button>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h2>💥 GAME OVER</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">PLAY AGAIN</button>
        </div>

        <div id="pauseScreen" class="overlay hidden">
            <h2>GAME PAUSED</h2>
            <button id="resumeBtn">RESUME</button>
        </div>

    </div>

    <div class="controls">

        <button id="leftBtn" class="control-btn">⬅</button>

        <button id="pauseBtn" class="pause-btn">Ⅱ</button>

        <button id="rightBtn" class="control-btn">➡</button>

    </div>

    <p class="instructions">
        PC: Use ← → or A / D keys<br>
        Mobile: Use left and right buttons
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
