<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe Game</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 380px;
}

h1 {
    color: #243b55;
    margin-bottom: 20px;
    font-size: 32px;
}

#status {
    margin-bottom: 20px;
    color: #333;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.cell {
    height: 95px;
    background: #dce6f1;
    border: none;
    border-radius: 12px;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    color: #243b55;
}

.cell:disabled {
    cursor: not-allowed;
    opacity: 1;
}

#score {
    margin: 25px 0;
    font-size: 22px;
}

#restart {
    background: #243b55;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}

#restart:hover {
    background: #41658d;
}

</style>
</head>

<body>

<div class="game">

    <h1>Tic Tac Toe</h1>

    <h2 id="status">Player X's Turn</h2>

    <div class="board">

        <button class="cell" type="button"></button>
        <button class="cell" type="button"></button>
        <button class="cell" type="button"></button>

        <button class="cell" type="button"></button>
        <button class="cell" type="button"></button>
        <button class="cell" type="button"></button>

        <button class="cell" type="button"></button>
        <button class="cell" type="button"></button>
        <button class="cell" type="button"></button>

    </div>

    <h3 id="score">X: 0 | O: 0</h3>

    <button id="restart" type="button">
        Restart Game
    </button>

</div>

<script>

const cells = document.querySelectorAll(".cell");

const statusText = document.getElementById("status");

const scoreText = document.getElementById("score");

const restart = document.getElementById("restart");

let currentPlayer = "X";

let board = ["", "", "", "", "", "", "", "", ""];

let gameActive = true;

let scoreX = 0;
let scoreO = 0;

const winPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

// Cell Click Function

cells.forEach((cell, index) => {

    cell.addEventListener("click", function() {

        if (board[index] !== "" || !gameActive) {
            return;
        }

        board[index] = currentPlayer;

        cell.textContent = currentPlayer;

        cell.disabled = true;

        checkWinner();

    });

});

// Winner Check Function

function checkWinner() {

    for (let pattern of winPatterns) {

        let [a, b, c] = pattern;

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            statusText.textContent =
                "Player " + currentPlayer + " Wins! 🎉";

            if (currentPlayer === "X") {
                scoreX++;
            } else {
                scoreO++;
            }

            gameActive = false;

            updateScore();

            return;
        }
    }

    if (!board.includes("")) {

        statusText.textContent = "Match Draw!";

        gameActive = false;

        return;
    }

    currentPlayer =
        currentPlayer === "X" ? "O" : "X";

    statusText.textContent =
        "Player " + currentPlayer + "'s Turn";

}

// Score Update

function updateScore() {

    scoreText.textContent =
        "X: " + scoreX + " | O: " + scoreO;

}

// Restart Game

restart.addEventListener("click", function() {

    board = ["", "", "", "", "", "", "", "", ""];

    currentPlayer = "X";

    gameActive = true;

    cells.forEach(cell => {

        cell.textContent = "";

        cell.disabled = false;

    });

    statusText.textContent = "Player X's Turn";

});

</script>

</body>
</html>
